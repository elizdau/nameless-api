services:
  - type: web
    name: nameless-api
    env: python
    branch: openwebui-openrouter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn memory_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
    healthCheckPath: /
